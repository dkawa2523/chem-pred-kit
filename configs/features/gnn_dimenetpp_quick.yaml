featureset:
  name: "gnn_dimenetpp_quick"

featurizer:
  node_features: ["atomic_num"]
  edge_features: []
  angle_features: ["angle"]
  edge_mode: "radius"
  radius_cutoff: 5.0
  max_neighbors: 32
  use_3d_pos: true
  conformer:
    enabled: true
    seed: 42
    method: "etkdg"
    forcefield: "uff"
    max_iters: 200
    num_conformers: 1
    aggregation: "mean"
    on_failure: "fallback_2d"
    max_attempts: 2
    cache: true
    use_smiles_fallback: true
