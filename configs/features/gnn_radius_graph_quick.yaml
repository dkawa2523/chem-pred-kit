featureset:
  name: "gnn_radius_graph_quick"

featurizer:
  node_features: ["atomic_num","degree","formal_charge","aromatic","num_h","in_ring"]
  edge_features: ["distance","gaussian"]
  edge_mode: "radius"
  radius_cutoff: 5.0
  max_neighbors: 24
  gaussian_expansion:
    enabled: true
    num_centers: 24
    min: 0.0
    max: 5.0
  use_3d_pos: true
  add_global_descriptors: ["MolWt","TPSA","MolLogP"]
  conformer:
    enabled: true
    seed: 42
    method: "etkdg"
    forcefield: "uff"
    max_iters: 100
    num_conformers: 1
    aggregation: "mean"
    on_failure: "fallback_2d"
    max_attempts: 2
    cache: true
    use_smiles_fallback: true
