benchmark_suite:
  name: "qm9_quick_extra"
  description: "QM9 quick additional models (RF/CatBoost/GPR + GIN/DimeNet++/Graphormer/GraphTransformer)."
  matrix:
    datasets: ["qm9_quick"]
    targets: ["gap_zscore"]
    entries:
      - name: "fp_morgan_desc_rf"
        model: "fp_rf_quick"
        features: "fp_morgan_desc"
      - name: "fp_morgan_desc_catboost"
        model: "fp_catboost_quick"
        features: "fp_morgan_desc"
      - name: "fp_morgan_desc_gpr"
        model: "fp_gpr_quick"
        features: "fp_morgan_desc"
      - name: "gin_graph_quick"
        model: "gin"
        features: "gnn_graph_quick"
      - name: "dimenetpp_radius_quick"
        model: "dimenetpp"
        features: "gnn_dimenetpp"
      - name: "graphormer_graph_quick"
        model: "graphormer"
        features: "gnn_graph_quick"
      - name: "graph_transformer_graph_quick"
        model: "graph_transformer"
        features: "gnn_graph_quick"
  defaults:
    preprocess:
      fp: "fp_default"
      gnn: "none"
    train:
      fp: "fp_default"
      gnn: "gnn_quick_3d"
    pretrain: "default"
    eval: "default"
  run:
    evaluate: true
    visualize: false
    leaderboard: false
    stop_on_error: true
    dry_run: false
  tags:
    - "benchmark"
    - "suite:qm9_quick_extra"
