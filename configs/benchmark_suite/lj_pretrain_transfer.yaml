benchmark_suite:
  name: "lj_pretrain_transfer"
  description: "LJ epsilon transfer: baseline vs QM9 supervised pretrain (MPNN)."
  matrix:
    datasets: ["lj"]
    targets: ["lj_epsilon"]
    entries:
      - name: "mpnn_from_scratch"
        model: "gnn_mpnn"
        features: "gnn_graph"
        pretrain: "default"
      - name: "mpnn_qm9_finetune"
        model: "gnn_mpnn"
        features: "gnn_graph"
        pretrain: "qm9_supervised"
  defaults:
    preprocess:
      gnn: "none"
    train:
      gnn: "gnn_default"
    pretrain: "default"
    eval: "default"
    visualize:
      splits: ["val", "test"]
      include_train_hist: true
      target_mode: "primary"
  leaderboard:
    metric_key: "mae"
    metric_split: "val"
    sort_order: "asc"
    top_n: 20
  run:
    evaluate: true
    visualize: true
    leaderboard: true
    stop_on_error: true
    dry_run: false
  tags:
    - "pretrain:qm9_supervised"
