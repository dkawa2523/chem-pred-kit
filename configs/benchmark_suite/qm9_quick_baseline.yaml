benchmark_suite:
  name: "qm9_quick_baseline"
  description: "QM9 quick baseline matrix (FP + GNN, subset for smoke)."
  matrix:
    datasets: ["qm9_quick"]
    targets: ["gap"]
    entries:
      - name: "fp_morgan_quick_lgbm"
        model: "fp_lightgbm_quick"
        features: "fp_morgan_quick"
      - name: "fp_morgan_desc_lgbm"
        model: "fp_lightgbm_quick"
        features: "fp_morgan_desc"
      - name: "gcn_graph_quick"
        model: "gnn_gcn_quick"
        features: "gnn_graph_quick"
      - name: "mpnn_graph_quick"
        model: "gnn_mpnn_quick"
        features: "gnn_graph_quick"
  defaults:
    preprocess:
      fp: "fp_default"
      gnn: "none"
    train:
      fp: "fp_default"
      gnn: "gnn_quick_baseline"
    pretrain: "default"
    eval: "default"
  run:
    evaluate: true
    visualize: false
    leaderboard: false
    stop_on_error: true
    dry_run: false
  tags:
    - "benchmark"
    - "suite:qm9_quick_baseline"
