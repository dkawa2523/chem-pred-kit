name: pytest-optional

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  pytest_optional:
    runs-on: ubuntu-latest
    env:
      TORCH_VERSION: "2.1.2"
      PYG_WHEEL_URL: "https://data.pyg.org/whl/torch-2.1.2+cpu.html"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt pytest
      - name: Install torch + pyg (2D)
        run: |
          python -m pip install torch==${{ env.TORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/gnn.txt --no-deps -f ${{ env.PYG_WHEEL_URL }}
      - name: Install optional deps (3D + transformer)
        run: |
          python -m pip install -r requirements/optional-3d.txt --no-deps -f ${{ env.PYG_WHEEL_URL }}
          python -m pip install -r requirements/optional-transformer.txt
      - name: Run optional tests
        run: pytest -q -m optional
